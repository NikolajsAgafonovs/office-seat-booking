# Fly.io configuration (decision 0009). One machine, SQLite on a volume, API + static client.
app = "office-seat-booking"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/seat.db"
  AUTH_MODE = "dev"            # decision 0007: real sign-in not wired yet; demo stage only
  OFFICE_TZ = "Europe/Riga"    # R-30
  ADMIN_USERS = "carol"        # decision 0004, option 1
  READONLY_USERS = "dan"       # R-25
  FLOOR_PLAN_PATH = "/app/docs/floor-plan.json"
  CLIENT_DIST = "/app/client/dist"

[[mounts]]
  source = "seat_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Exactly one machine, always on: the SSE bus is in-process and the database is a file.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
